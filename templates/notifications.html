{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="page-head"><h1><i class="fa-solid fa-bell"></i> Notifications</h1></div>
<div class="card">
  {% if notes %}
    <ul class="notif-list">
      {% for n in notes %}
        <li class="notif notif-{{ n.category }}">
          <i class="fa-solid fa-circle"></i>
          <span>{{ n.message }}</span>
          <time class="muted">{{ n.created_at.strftime('%d %b %Y, %H:%M') }}</time>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="muted">You have no notifications.</p>
  {% endif %}
</div>
{% endblock %}
