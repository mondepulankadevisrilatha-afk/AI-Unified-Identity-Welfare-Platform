{# Reusable WTForms field renderer #}
{% macro field(f, placeholder="") %}
  <div class="form-group {% if f.errors %}has-error{% endif %}">
    {% if f.type != 'BooleanField' %}
      {{ f.label }}
    {% endif %}
    {% if f.type == 'BooleanField' %}
      <label class="checkbox">{{ f() }} <span>{{ f.label.text }}</span></label>
    {% else %}
      {{ f(placeholder=placeholder, class="input") }}
    {% endif %}
    {% for e in f.errors %}<small class="field-error">{{ e }}</small>{% endfor %}
  </div>
{% endmacro %}
